name: Mini App → GitHub Pages

# Mini App statik fayllardan iborat, shuning uchun uni GitHub Pages beradi —
# u hech qachon "uxlamaydi", Telegram oynasi darhol ochiladi. Backend (bot,
# API, admin panel) o'z joyida, Render'da qolaveradi.

on:
  push:
    branches: [claude/salom-0u45my]
    paths:
      - 'miniapp/**'
      - '.github/workflows/deploy-miniapp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages sozlamasi
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - run: npm --prefix miniapp ci --no-audit --no-fund

      - name: Yig'ish
        run: npm --prefix miniapp run build
        env:
          # Pages ilovani "/<repo>/" ostidan beradi
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Backend manzili. O'zgarsa — Settings → Secrets and variables →
          # Actions → Variables da API_BASE_URL ni yangilang (kodga tegmasdan).
          VITE_API_URL: ${{ vars.API_BASE_URL || 'https://giyos-barbershop.onrender.com' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
